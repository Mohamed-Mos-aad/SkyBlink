<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SkyBlink — See the Sky Change (NASA SPHEREx)</title>
    <!-- Google Fonts: Space Grotesk (Display), Inter (Body), JetBrains Mono (Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'cosmic-blue': '#3D7BFF',
              'cosmic-blue-hover': '#6A9BFF',
              'comet-coral': '#FF7A59',
              'comet-coral-hover': '#FF8F73',
              'real-data': '#3DDC97',
              'estimated-motion': '#FFC857',
              'border-subtle': 'rgba(255, 255, 255, 0.10)',
              dark: {
                background: '#080D26',
                'on-background': '#F4F7FF',
                surface: '#0E163B',
                'on-surface': '#F4F7FF',
                'surface-raised': '#162256',
                'on-surface-raised': '#F4F7FF',
                primary: '#3D7BFF',
                'on-primary': '#1A1A1A',
                secondary: '#B6C2E8',
                'on-secondary': '#080D26',
                muted: '#8392C4',
              },
              space: {
                950: '#080D26',
                900: '#0E163B',
                800: '#162256',
                700: '#212F6B',
              },
              cyanAccent: '#3D7BFF',
              infrared: '#FF7A59',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            borderRadius: {
              sm: '4px',
              md: '8px',
              lg: '12px',
              xl: '16px',
              full: '9999px',
            },
            boxShadow: {
              'surface-raised': '0 24px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12)',
              'cosmic-glow': '0 0 24px rgba(61, 123, 255, 0.35)',
              'coral-glow': '0 0 24px rgba(255, 122, 89, 0.45)',
            },
            transitionDuration: {
              'state': '120ms',
              'pulse': '200ms',
            },
            transitionTimingFunction: {
              'state': 'ease-out',
              'pulse': 'cubic-bezier(0.16, 1, 0.3, 1)',
            },
          },
        },
      };
    </script>
    <style>
      /* Custom observatory scrollbars & micro-interactions */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #080D26;
      }
      ::-webkit-scrollbar-thumb {
        background: #162256;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.10);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3D7BFF;
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.85); opacity: 0.9; }
        50% { transform: scale(1.25); opacity: 0.3; }
        100% { transform: scale(0.85); opacity: 0.9; }
      }
      .animate-pulse-ring {
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-[#080D26] text-[#F4F7FF] font-sans min-h-screen overflow-x-hidden selection:bg-[#3D7BFF] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
